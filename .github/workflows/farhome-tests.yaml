name: Farhome tests
on:
  push:
    branches: [farhome, 'work/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    # Python 3.14.2 has a setup-python build for 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components/switch_manager
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r ../requirements-browser-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python ../tests/browser/legacy_revision.py
      - run: python ../tests/browser/farhome_panel.py
